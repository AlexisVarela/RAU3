name: Correr Prueba con Docker

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t carrito-tests .

      - name: Prepare test results folder
        run: mkdir -p test-results

      - name: Run container and execute tests
        run: docker run --rm -v ${{ github.workspace }}/test-results:/usr/src/app/test-results carrito-tests

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: jest-results
          path: test-results/results.json
